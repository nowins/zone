[package]
name = "zone-player"
version = "1.0.0"
description = "A Zune-inspired local music player"
authors = ["Zone"]
edition = "2021"

[lib]
name = "zone_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
feed-rs = "2.4"
flate2 = "1"
httpdate = "1"
percent-encoding = "2"
lofty = "0.22"
notify = "8"
quick-xml = "0.41"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "vorbis", "pcm", "wav", "ogg", "isomp4", "mkv"] }
tauri = { version = "2.9.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
walkdir = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Foundation",
  "Media",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
